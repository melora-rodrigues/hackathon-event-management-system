{% extends 'main.html' %}
{% block content %}
<h2>Submit Project for {{ event.name }}</h2>

{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <label for="first_name">First Name:</label>
    <input type="text" id="first_name" name="first_name" required><br><br>
    <label for="github_link">GitHub Project Link:</label><br>
    <input type="url" id="github_link" name="github_link" placeholder="https://github.com/yourproject" required><br><br>
    
    <button type="submit">Submit</button>
</form>
{% endblock %}
